version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: cvboosta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvboosta
      POSTGRES_PASSWORD: cvboosta
      POSTGRES_DB: cvboosta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: python:3.12-slim
    container_name: cvboosta-api
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      - postgres

volumes:
  pgdata:

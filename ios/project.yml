name: CVBoosta
options:
  deploymentTarget:
    iOS: 17.0
configs:
  Debug: debug
  Release: release
targets:
  CVBoostaApp:
    type: application
    platform: iOS
    sources:
      - CVBoostaApp
    info:
      path: CVBoostaApp/Info.plist
      properties:
        CFBundleDisplayName: CVBoosta
        CFBundleIdentifier: com.cvboosta.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        API_BASE_URL: http://127.0.0.1:8000
        WEB_BASE_URL: https://cvboosta.com
        DEMO_FALLBACK_ENABLED: true
        APP_BUNDLE_ID_PLACEHOLDER: com.cvboosta.app
        NSFaceIDUsageDescription: Face ID protects sensitive career data and exported documents.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cvboosta.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CVBoostaWidgetExtension

  CVBoostaWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - CVBoostaWidgetExtension
      - CVBoostaApp/Core/Models/CVBoostaActivityAttributes.swift
    info:
      path: CVBoostaWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: CVBoosta Widgets
        CFBundleIdentifier: com.cvboosta.app.widgets
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cvboosta.app.widgets
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  CVBoostaAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CVBoostaAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cvboosta.app.tests
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CVBoostaApp

name: CVBoosta
options:
  deploymentTarget:
    iOS: 17.0
configs:
  Debug: debug
  Release: release
targets:
  CVBoostaApp:
    type: application
    platform: iOS
    sources:
      - path: CVBoostaApp
        excludes:
          - CVBOOSTA IOS ICON.icon
          - CVBOOSTA IOS ICON 2.icon
          - CVBOOSTA IOS ICON 3.icon
      - SharedWidgetSupport
    info:
      path: CVBoostaApp/Info.plist
      properties:
        CFBundleDisplayName: CVBoosta
        CFBundleIdentifier: com.cvboosta.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.1.13"
        API_BASE_URL: https://cvboosta-backend-615826584976.europe-west3.run.app
        WEB_BASE_URL: https://cvboosta.com
        APP_ENV: production
        APP_BUNDLE_ID_PLACEHOLDER: com.cvboosta.app
        APNS_DEACTIVATE_PATH: /devices/apns/deactivate
        APNS_ENVIRONMENT: $(APS_ENVIRONMENT)
        APNS_REGISTER_PATH: /devices/apns
        LIVE_ACTIVITY_DEACTIVATE_PATH: /live-activities/apns/deactivate
        LIVE_ACTIVITY_PUSH_TO_START_DEACTIVATE_PATH: /live-activities/apns/push-to-start/deactivate
        LIVE_ACTIVITY_PUSH_TO_START_REGISTER_PATH: /live-activities/apns/push-to-start
        LIVE_ACTIVITY_REGISTER_PATH: /live-activities/apns
        NSFaceIDUsageDescription: Face ID protects sensitive career data and exported documents.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cvboosta.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: G5CT2RF98B
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CVBoostaApp/CVBoostaApp.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - target: CVBoostaWidgetExtension

  CVBoostaWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - CVBoostaWidgetExtension
      - SharedWidgetSupport
      - CVBoostaApp/Core/Models/CVBoostaActivityAttributes.swift
    info:
      path: CVBoostaWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: CVBoosta Widgets
        CFBundleIdentifier: com.cvboosta.app.widgets
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.1.13"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cvboosta.app.widgets
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: G5CT2RF98B
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CVBoostaWidgetExtension/CVBoostaWidgetExtension.entitlements

  CVBoostaAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CVBoostaAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cvboosta.app.tests
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: G5CT2RF98B
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CVBoostaApp
